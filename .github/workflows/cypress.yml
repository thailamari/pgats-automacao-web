name: CI - Cypress Tests

on:
  push:
    branches: [ main, thaila ]
  pull_request:
    branches: [ main, thaila ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Diagnostics - node/npm and repo files
        run: |
          echo "--- node & npm versions ---"
          node -v || true
          npm -v || true
          echo "--- repo root files ---"
          ls -la || true
          echo "--- head of package-lock.json (if present) ---"
          if [ -f package-lock.json ]; then head -n 40 package-lock.json || true; else echo "no package-lock.json"; fi

      - name: Install dependencies (prefer npm ci, fall back to npm install)
        run: |
          echo "Has package-lock.json?"
          if [ -f package-lock.json ]; then echo "package-lock.json found (lockfileVersion: $(jq -r '.lockfileVersion' package-lock.json 2>/dev/null || echo unknown))"; else echo "no package-lock.json"; fi
          echo "Trying npm ci (preferred for reproducible builds)"
          if npm ci --prefer-offline --no-audit --no-fund; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed, falling back to npm install"
            npm install --no-audit --no-fund
          fi

      - name: Start Xvfb (for Cypress GUI deps)
        run: |
          sudo Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99

      - name: Run Cypress tests
        env:
          CI: true
        run: |
          npx cypress run --spec "cypress/e2e/prova-final.cy.js"

      - name: Upload artifacts (screenshots, videos, reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
            cypress/reports
            mochawesome-report
