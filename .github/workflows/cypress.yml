name: CI - Cypress Tests (minimal)

on:
	push:
		branches: [ main, thaila ]
	pull_request:
		branches: [ main, thaila ]

jobs:
	test:
		runs-on: ubuntu-latest
		steps:
			- name: Checkout
				uses: actions/checkout@v4
				with:
					fetch-depth: 0

			- name: Setup Node.js
				uses: actions/setup-node@v4
				with:
					node-version: '18'

			- name: Install dependencies (npm install)
				run: |
					echo "=== START INSTALL LOG ===" > install.log
					npm install --no-audit --no-fund 2>&1 | tee -a install.log

			- name: Upload install log
				uses: actions/upload-artifact@v4
				with:
					name: install-log
					path: install.log

			- name: Install Cypress binary
				run: |
					npx cypress install

			- name: Start virtual display
				run: |
					sudo Xvfb :99 -screen 0 1280x1024x24 &
					export DISPLAY=:99

			- name: Run Cypress spec
				env:
					CI: true
				run: |
					npx cypress run --spec "cypress/e2e/prova-final.cy.js"

			- name: Upload Cypress artifacts
				if: always()
				uses: actions/upload-artifact@v4
				with:
					name: cypress-artifacts
					path: |
						cypress/screenshots
						cypress/videos
						cypress/reports
						mochawesome-report

