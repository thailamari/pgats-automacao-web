name: 🧪 Cypress E2E Tests (AutomationExercise)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout do Código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Cache de dependências
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 4. Instalar dependências
      - name: Instalar dependências
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install

      # 5. Rodar Testes com Cypress GitHub Action
      - name: Rodar Testes E2E Específicos
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          spec: cypress/e2e/prova-final.cy.js
        env: # <--- ADICIONAMOS O BLOCO ENV AQUI
          # Ação correta para resolver o erro do sandbox no ambiente CI
          CYPRESS_NO_BROWSER_SANDBOX: 1 
          # Opcional: Para aumentar o timeout de requisição em ambientes CI
          CYPRESS_REQUES_TIMEOUT: 15000 
          
      # 6. Opcional: Upload de Artefatos
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
