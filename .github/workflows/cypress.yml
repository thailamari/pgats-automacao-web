name: CI - Cypress Tests (minimal)

on:
  push:
    branches: [ main, thaila ]
  pull_request:
    branches: [ main, thaila ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (force npm install)
        run: |
          echo "Running npm install to ensure dependencies are available"
          npm install --no-audit --no-fund

      - name: Start Xvfb
        run: |
          sudo Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99

      - name: Run Cypress tests
        env:
          CI: true
        run: |
          npx cypress run --spec "cypress/e2e/prova-final.cy.js"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
            cypress/reports
            mochawesome-report
