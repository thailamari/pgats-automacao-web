name: 🧪 Cypress E2E Tests (AutomationExercise)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    steps:
      # ... Etapas 1, 2, 3 (Checkout, Setup Node, Cache) permanecem as mesmas ...

      # 4. Instalar dependências (MANTIDO)
      - name: Instalar dependências
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install

      # 5. Rodar Testes com COMANDO EXPLICITO (SOLUÇÃO)
      # Usamos a ação para fazer o setup do ambiente, mas definimos o comando de execução manualmente.
      - name: Rodar Testes E2E Específicos (CORRIGIDO)
        uses: cypress-io/github-action@v6
        with:
          # Define a pasta onde o Cypress deve procurar as specs
          spec: cypress/e2e/prova-final.cy.js
          
          # Forçamos o comando de execução, injetando o argumento --no-sandbox
          # no comando 'cypress run' (não 'cypress install')
          command: npx cypress run --browser chrome --e2e --spec cypress/e2e/prova-final.cy.js --config-file cypress.config.js --env CYPRESS_NO_BROWSER_SANDBOX=1
        
        # MANTEMOS A VARIAVEL DE AMBIENTE PARA GARANTIR
        env:
          CYPRESS_NO_BROWSER_SANDBOX: 1 
          CYPRESS_REQUEST_TIMEOUT: 15000 
          
      # 6. Opcional: Upload de Artefatos (MANTIDO)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
