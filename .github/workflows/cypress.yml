name: 🧪 Cypress E2E Tests (Script Puro)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      # 1. Configurar Node.js (Versão 18 para evitar erros de engine)
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 2. Instalar dependências (Inclui o Cypress)
      - name: Instalar Dependências (npm install)
        run: npm install

      # 3. Executar Testes E2E (CORREÇÃO FINAL: Usamos 'run' puro)
      - name: Executar Testes E2E (Comando Pós-Instalação)
        run: |
          # Define a variável de ambiente (export) e executa o Cypress
          # O npx cypress run --browser chrome é executado no terminal da CI
          export CYPRESS_NO_BROWSER_SANDBOX=1
          npx cypress run --browser chrome --e2e --spec cypress/e2e/prova-final.cy.js --config-file cypress.config.js
        # A remoção do uses: cypress-io/github-action garante que o comando de instalação
        # incorreto nunca será executado.
        
      # 4. Upload de Artefatos (MANTIDO)
      # Nota: Os artefatos podem precisar ser ajustados se o Cypress rodar em uma pasta diferente.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
