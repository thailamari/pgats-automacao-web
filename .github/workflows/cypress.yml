name: 🧪 Cypress E2E Tests (Script Puro)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      # 1. Configurar Node.js (Versão 18 para evitar erros de engine)
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 2. Instalar dependências (Inclui o Cypress)
      - name: Instalar Dependências (npm install)
        run: npm install

      # 3. Rodar Testes Puros do Cypress (Substitui a ação 'cypress-io/github-action')
      - name: Executar Testes E2E (Script Puro)
        # Instalamos o navegador necessário e rodamos o comando manualmente.
        run: |
          # Define a variável de ambiente para o Cypress: desativa o sandbox
          export CYPRESS_NO_BROWSER_SANDBOX=1
          
          # Executa o Cypress com o navegador Chrome e o argumento necessário
          npx cypress run --browser chrome --e2e --spec cypress/e2e/prova-final.cy.js --config-file cypress.config.js
        # O comando 'npx cypress run' vai usar o binário instalado pelo 'npm install'
        
      # 4. Upload de Artefatos (MANTIDO)
      # Nota: Os artefatos podem precisar ser ajustados se o Cypress rodar em uma pasta diferente.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
