name: 🧪 Cypress E2E Tests (AutomationExercise)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cypress-run:
    # Ajustamos para uma versão LTS que não tem problema de engine (Node 18)
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js (USAMOS VERSÃO ESTÁVEL 18 PARA EVITAR WARNS DE EBADENGINE)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' 

      # 3. Cache de dependências
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 4. Instalar dependências (MANTIDO)
      - name: Instalar dependências
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install

      # 5. Rodar Testes com COMANDO EXPLÍCITO (RESOLVENDO O ERRO DO SANDBOX NA RAIZ)
      - name: Rodar Testes E2E Específicos
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          # DESLIGAMOS A INSTALAÇÃO DA AÇÃO, POIS JÁ FIZEMOS COM O NPM
          install: false
          
          # Usamos o campo 'command' para executar a linha e injetar o --no-sandbox
          # no processo do navegador, evitando o conflito de comandos.
          command: npx cypress run --e2e --spec cypress/e2e/prova-final.cy.js --config-file cypress.config.js --env CYPRESS_NO_BROWSER_SANDBOX=1
        
        env: 
          # Essa variável garante que o Cypress não tenta instalar o binário de novo.
          CYPRESS_INSTALL_BINARY: 0 
          # Variável para o navegador rodar sem sandbox (necessário no CI)
          CYPRESS_NO_BROWSER_SANDBOX: 1 
          
      # 6. Upload de Artefatos
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos