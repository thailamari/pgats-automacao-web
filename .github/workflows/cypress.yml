name: CI - Cypress Tests

on:
  push:
    branches: [ main, thaila ]
  pull_request:
    branches: [ main, thaila ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci

      - name: Start Xvfb (for Cypress GUI deps)
        run: |
          sudo Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99

      - name: Run Cypress tests
        env:
          CI: true
        run: |
          npx cypress run --spec "cypress/e2e/prova-final.cy.js"

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots || cypress/videos || cypress/reports || cypress/results || mochawesome-report

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos

      - name: Upload mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: cypress/reports || mochawesome-report
